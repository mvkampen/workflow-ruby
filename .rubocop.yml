plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  Exclude:
    - "bin/*"

Layout/LineLength:
  Max: 120

Naming/MethodName:
  AllowedPatterns:
    - "\\A(?:Success|Failure|Start|Continue|Stop|Edge|Vertex)\\z"

Metrics/BlockLength:
  Exclude:
    - "test/**/*_test.rb"
